name: Deploy Forest Fair backend

on:
  push:
    branches: [main]
    paths:
      - bot.py
      - auth_api.py
      - auth_store.py
      - auth_email.py
      - telegram_auth.py
      - telegram_oidc.py
      - auth_schema.sql
      - requirements.txt
      - deploy_remote.sh
      - Обновить_сервер.bat
      - test_auth_api.py
      - test_auth_email.py
      - test_auth_store.py
      - test_order_routes_integration.py
      - test_orders_auth.py
      - test_publishing_reliability.py
      - test_telegram_auth.py
      - test_telegram_oidc.py
      - .github/workflows/deploy-vps.yml
  pull_request:
    branches: [main]
    paths:
      - bot.py
      - auth_api.py
      - auth_store.py
      - auth_email.py
      - telegram_auth.py
      - telegram_oidc.py
      - auth_schema.sql
      - requirements.txt
      - deploy_remote.sh
      - Обновить_сервер.bat
      - test_auth_api.py
      - test_auth_email.py
      - test_auth_store.py
      - test_order_routes_integration.py
      - test_orders_auth.py
      - test_publishing_reliability.py
      - test_telegram_auth.py
      - test_telegram_oidc.py
      - .github/workflows/deploy-vps.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forest-fair-vps
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run test suite
        run: python -m unittest discover -v

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment: vps-production
    steps:
      - uses: actions/checkout@v5
      - name: Check required files
        run: |
          set -euo pipefail
          for f in bot.py auth_api.py auth_store.py auth_email.py telegram_auth.py telegram_oidc.py auth_schema.sql deploy_remote.sh; do
            test -s "$f"
          done
      - name: Validate deployment secrets
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" || { echo "Missing VPS_SSH_PRIVATE_KEY_B64"; exit 1; }
          test -n "$KNOWN_HOSTS" || { echo "Missing VPS_KNOWN_HOSTS"; exit 1; }
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s' "$SSH_KEY" | base64 --decode > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" > /dev/null
          printf '%s\\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Upload files to staging
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes root@89.22.228.22 'mkdir -p /root/forest-fair-deploy-staging && chmod 700 /root/forest-fair-deploy-staging'
          scp -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes bot.py auth_api.py auth_store.py auth_email.py telegram_auth.py telegram_oidc.py auth_schema.sql deploy_remote.sh root@89.22.228.22:/root/forest-fair-deploy-staging/
      - name: Run staged deployment script
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes root@89.22.228.22 'chmod 700 /root/forest-fair-deploy-staging/deploy_remote.sh && /root/forest-fair-deploy-staging/deploy_remote.sh'
