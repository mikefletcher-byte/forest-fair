name: Python dependency security audit

on:
  push:
    branches:
      - main
      - integration/unified-auth-main
    paths:
      - requirements.txt
      - .github/workflows/dependency-audit.yml
  pull_request:
    branches:
      - main
    paths:
      - requirements.txt
      - .github/workflows/dependency-audit.yml
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    name: Audit Python dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Check requirements for known vulnerabilities
        run: pip-audit --strict --requirement requirements.txt
