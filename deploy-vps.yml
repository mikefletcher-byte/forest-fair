name: Deploy Forest Fair VPS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - bot.py
      - auth_api.py
      - auth_store.py
      - auth_email.py
      - telegram_auth.py
      - auth_schema.sql

permissions:
  contents: read

concurrency:
  group: forest-fair-vps
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install aiohttp "aiogram>=3,<4"
      - name: Run tests
        run: python -m unittest discover -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          set -euo pipefail
          for f in bot.py auth_api.py auth_store.py auth_email.py telegram_auth.py auth_schema.sql; do
            test -s "$f"
          done
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Upload to staging directory
        run: |
          set -euo pipefail
          SSH_OPTS="-i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes"
          ssh $SSH_OPTS root@89.22.228.22 'mkdir -p /root/forestbot-deploy'
          scp $SSH_OPTS bot.py auth_api.py auth_store.py auth_email.py telegram_auth.py auth_schema.sql root@89.22.228.22:/root/forestbot-deploy/
      - name: Install files and restart service
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes root@89.22.228.22 'set -eu
            for f in bot.py auth_api.py auth_store.py auth_email.py telegram_auth.py auth_schema.sql; do
              test -s "/root/forestbot-deploy/$f"
            done
            for f in bot.py auth_api.py auth_store.py auth_email.py telegram_auth.py auth_schema.sql; do
              install -m 644 "/root/forestbot-deploy/$f" "/root/$f"
            done
            systemctl restart forestbot
            sleep 2
            systemctl is-active --quiet forestbot
          '
