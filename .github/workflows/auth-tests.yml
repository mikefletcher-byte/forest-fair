name: Auth module tests

on:
  push:
    branches:
      - main
      - integration/unified-auth-main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API runtime dependencies
        run: python -m pip install aiohttp "aiogram>=3,<4"

      - name: Run unit and HTTP integration tests
        run: python -m unittest discover -v
