name: Deploy Forest Fair backend to VPS

on:
  push:
    branches: [main]
    paths:
      - bot.py
      - auth_api.py
      - auth_store.py
      - auth_email.py
      - telegram_auth.py
      - test_telegram_auth.py
      - auth_schema.sql
      - .github/workflows/deploy-vps.yml
  pull_request:
    branches: [main]
    paths:
      - bot.py
      - auth_api.py
      - auth_store.py
      - auth_email.py
      - telegram_auth.py
      - test_telegram_auth.py
      - auth_schema.sql
      - requirements.txt
      - .github/workflows/deploy-vps.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forest-fair-vps-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install API runtime dependencies
        run: python -m pip install aiohttp "aiogram>=3,<4" "cryptography>=50,<51"
      - name: Run tests
        run: python -m unittest discover -v

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    environment: vps-production
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment secrets
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY" || { echo "Missing VPS_SSH_PRIVATE_KEY_B64"; exit 1; }
          test -n "$KNOWN_HOSTS" || { echo "Missing VPS_KNOWN_HOSTS"; exit 1; }
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$SSH_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Upload server files to staging directory
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes root@89.22.228.22 'mkdir -p /root/forest-fair-deploy-staging && chmod 700 /root/forest-fair-deploy-staging'
          scp -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes bot.py auth_api.py auth_store.py auth_email.py telegram_auth.py auth_schema.sql root@89.22.228.22:/root/forest-fair-deploy-staging/
      - name: Backup, install patched cryptography, restart and verify
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes root@89.22.228.22 'set -eu
            backup_dir="/root/forest-fair-backups/crypto-$(date -u +%Y%m%dT%H%M%SZ)"
            install -d -m 700 "$backup_dir"
            for file in bot.py auth_api.py auth_store.py auth_email.py telegram_auth.py auth_schema.sql; do
              if test -f "/root/$file"; then cp -a "/root/$file" "$backup_dir/"; fi
            done
            /root/venv/bin/python -m pip freeze > "$backup_dir/pip-freeze-before.txt"
            /root/venv/bin/python -m pip download --disable-pip-version-check --only-binary=:all: --no-deps "cryptography==46.0.7" -d "$backup_dir"
            cd /root/forest-fair-deploy-staging
            for file in bot.py auth_api.py auth_store.py auth_email.py telegram_auth.py auth_schema.sql; do
              test -s "$file"
              install -m 600 "$file" "/root/$file"
            done
            rollback() {
              echo "Deployment verification failed; restoring cryptography 46.0.7"
              /root/venv/bin/python -m pip install --disable-pip-version-check --no-index --find-links "$backup_dir" "cryptography==46.0.7"
              systemctl restart forestbot
              sleep 3
              systemctl is-active --quiet forestbot
            }
            if ! /root/venv/bin/python -m pip install --disable-pip-version-check "cryptography>=50,<51"; then
              rollback
              exit 1
            fi
            if ! /root/venv/bin/python -c "import cryptography; from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey; print(cryptography.__version__); k=Ed25519PrivateKey.generate(); m=bytes([70,70]); k.public_key().verify(k.sign(m),m)"; then
              rollback
              exit 1
            fi
            systemctl restart forestbot
            sleep 3
            if ! systemctl is-active --quiet forestbot; then rollback; exit 1; fi
            status=""
            for attempt in $(seq 1 15); do
              status=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 https://api.forest-fair.ru:8443/api/auth/me || true)
              if test "$status" = "401"; then break; fi
              echo "API is not ready yet (attempt $attempt/15, HTTP $status); waiting 2 seconds"
              sleep 2
            done
            if test "$status" != "401"; then
              echo "API health check returned HTTP $status after retries; expected 401 without a Bearer token"
              rollback
              exit 1
            fi
            echo "forestbot active; cryptography upgrade and API health check passed"
          '
