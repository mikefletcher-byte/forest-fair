name: Deploy Forest Fair backend to VPS

on:
  push:
    branches: [main]
    paths:
      - bot.py
      - auth_api.py
      - auth_store.py
      - auth_email.py
      - telegram_auth.py
      - auth_schema.sql
      - .github/workflows/deploy-vps.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forest-fair-vps-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API runtime dependencies
        run: python -m pip install aiohttp "aiogram>=3,<4" "cryptography>=42,<47"
      - name: Run tests
        run: python -m unittest discover -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: vps-production
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment secrets
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY" || { echo "Missing VPS_SSH_PRIVATE_KEY_B64"; exit 1; }
          test -n "$KNOWN_HOSTS" || { echo "Missing VPS_KNOWN_HOSTS"; exit 1; }
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$SSH_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Upload server files to staging directory
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes root@89.22.228.22 'mkdir -p /root/forest-fair-deploy-staging && chmod 700 /root/forest-fair-deploy-staging'
          scp -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes bot.py auth_api.py auth_store.py auth_email.py telegram_auth.py auth_schema.sql root@89.22.228.22:/root/forest-fair-deploy-staging/
      - name: Install, restart and verify
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes root@89.22.228.22 'set -eu
            cd /root/forest-fair-deploy-staging
            for file in bot.py auth_api.py auth_store.py auth_email.py telegram_auth.py auth_schema.sql; do
              test -s "$file"
              install -m 600 "$file" "/root/$file"
            done
            /root/venv/bin/python -m pip install --disable-pip-version-check "cryptography>=42,<47"
            systemctl restart forestbot
            sleep 2
            systemctl is-active --quiet forestbot
            echo "forestbot active; deployment completed"
          '
